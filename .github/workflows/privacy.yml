# Fails the push if anything personal or secret got into the public repository.
# No third-party actions and read-only permissions: nothing here can write to
# the repository or see a secret.
name: privacy check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the repository (full history, no submodules)
        run: |
          git clone --quiet --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch --quiet origin "${GITHUB_SHA}"
          git checkout --quiet "${GITHUB_SHA}"
      - name: Check every file in every commit
        run: python3 repo/scripts/check_public.py --history
